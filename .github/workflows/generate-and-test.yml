name: Generate and test OpenCL bindings

on:
  push:
    paths-ignore: ['**/*.md']
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  V_C_ERROR_BUG_REPORT_DISABLED: 1
  # Pin the required compiler and formatter so generated-source checks do not
  # change when a new V release artifact is published.
  V_VERSION: 0.5.2
  V3_COMMIT: efae23e85b3772a28e62884d554c1e88f91f52f4
  V3_VC_COMMIT: 2cbaf6bc2367937cd5f0b4ef923d1ef9aad613b3
  V3_TCC_COMMIT: d6e7ac1b1bcc98aed734a6ecbfa8509f24606c74
  VULKAN_REF: v3.2.2
  GLFW_REF: v2.0.1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Read pinned Khronos revisions
        id: pins
        run: v run tools/ci_opencl.vsh pins-all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/OpenCL-Docs
          ref: ${{ steps.pins.outputs.registry }}
          path: opencldocs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/OpenCL-Headers
          ref: ${{ steps.pins.outputs.headers }}
          path: openclheaders
      - name: Check out pinned Vulkan module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ env.VULKAN_REF }}
          path: .ci-modules/vulkan
      - name: Check out pinned GLFW module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: ${{ env.GLFW_REF }}
          path: .ci-modules/glfw
      - name: Install OpenCL ICD development files and CPU implementation
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Verify the public setup diagnostics
        run: v run packaging/published_setup.vsh --check
      - name: Generate bindings
        run: v run tools/ci_opencl.vsh generate-stable
      - name: Assemble module and run smoke test
        run: v run tools/ci_opencl.vsh smoke-stable
      - name: Install advanced-example dependencies
        run: sudo apt-get install --yes libvulkan-dev libvulkan-volk-dev libglfw3-dev mesa-vulkan-drivers vulkan-validationlayers libx11-dev openbox xauth xvfb glslc
      - name: Build and test Vulkan particles example
        env:
          VULKAN_SDK: /usr
          GLFW_INCLUDE: /usr/include
          GLFW_LIB: /usr/lib/x86_64-linux-gnu
        run: v run tools/ci_opencl.vsh particles

  macos-abi-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Read pinned Khronos revision
        id: pins
        run: v run tools/ci_opencl.vsh pins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/OpenCL-Docs
          ref: ${{ steps.pins.outputs.registry }}
          path: opencldocs
      - name: Generate bindings
        run: v run tools/ci_opencl.vsh generate-macos
      - name: Compile macOS ABI probe
        run: v run tools/ci_opencl.vsh macos-abi

  linux-v-master:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: generator-compiler
        uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: ${{ env.V_VERSION }}
          install-dependencies: false
      - name: Read pinned Khronos revision
        id: pins
        run: v run tools/ci_opencl.vsh pins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/OpenCL-Docs
          ref: ${{ steps.pins.outputs.registry }}
          path: opencldocs
      # V master currently builds a separate v1_fallback executable for tool
      # commands such as `v test`. Keep the complete source build together;
      # setup-v-action@v4's reduced cache bundle omits that executable.
      - name: Check out V master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout_v_master
        continue-on-error: true
        with:
          repository: vlang/v
          path: .ci-v-master
          fetch-depth: 1
      - name: Build V master
        id: setup_v_master
        if: steps.checkout_v_master.outcome == 'success'
        continue-on-error: true
        run: v run tools/ci_opencl.vsh build-master
      - name: Install OpenCL runtime and headers
        if: steps.setup_v_master.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Generate and assemble module
        id: generate_v_master
        if: steps.setup_v_master.outcome == 'success'
        continue-on-error: true
        env:
          GENERATOR_V: ${{ steps.generator-compiler.outputs.v-bin-path }}
        run: >-
          "$GENERATOR_V" run tools/ci_opencl.vsh generate-master
      - name: Run correctness smoke tests on V master
        id: test_v_master
        if: steps.setup_v_master.outcome == 'success' && steps.generate_v_master.outcome == 'success'
        continue-on-error: true
        run: v run tools/ci_opencl.vsh smoke-master
      - name: Report V master compatibility warning
        if: always() && (steps.checkout_v_master.outcome == 'failure' || steps.setup_v_master.outcome == 'failure' || steps.generate_v_master.outcome == 'failure' || steps.test_v_master.outcome == 'failure')
        run: echo "::warning::The live V master compatibility lane failed; stable V 0.5.2 and the pinned V3 frontend remain authoritative."

  strict-v3-frontend:
    name: Strict V3 frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: ${{ env.V_VERSION }}
          install-dependencies: false
      - name: Read pinned Khronos revision
        id: pins
        run: v run tools/ci_opencl.vsh pins
      - name: Check out pinned Vulkan module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ env.VULKAN_REF }}
          path: .ci-modules/vulkan
      - name: Check out pinned GLFW module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: ${{ env.GLFW_REF }}
          path: .ci-modules/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/OpenCL-Docs
          ref: ${{ steps.pins.outputs.registry }}
          path: opencldocs
      - name: Check out pinned V3 compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ env.V3_COMMIT }}
          path: .ci-v3
          fetch-depth: 1
      - name: Check out matching V3 bootstrap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ env.V3_VC_COMMIT }}
          path: .ci-v3/vc
          fetch-depth: 1
      - name: Check out matching V3 TinyCC runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ env.V3_TCC_COMMIT }}
          path: .ci-v3/thirdparty/tcc
          fetch-depth: 1
      - name: Build pinned V3 compiler
        run: v run tools/ci_opencl.vsh build-strict
      - name: Install OpenCL runtime and headers
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Generate, assemble and require strict frontend compatibility
        run: v run tools/ci_opencl.vsh strict-frontend
      - name: Run V3 backend smoke tests with TinyCC
        run: v run tools/ci_opencl.vsh strict-smoke

  windows-abi-compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Install OpenCL SDK
        run: vcpkg install opencl:x64-windows
      - name: Assemble generated module, reuse the SDK and compile ABI probe
        shell: pwsh
        run: v run tools/ci_opencl.vsh windows-abi

  linux-dependency-master:
    name: Advisory Vulkan and GLFW master
    continue-on-error: true
    runs-on: ubuntu-24.04
    env:
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: master
          path: .ci-modules/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: master
          path: .ci-modules/glfw
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd libvulkan-dev libvulkan-volk-dev libglfw3-dev
      - name: Assemble modules and compile particles
        run: v run tools/ci_opencl.vsh dependency-master

  required-checks:
    name: required-checks
    if: always()
    needs: [generate-and-test, strict-v3-frontend, linux-v-master, macos-abi-compile, windows-abi-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported CI lane to pass
        if: >-
          always() && (needs.generate-and-test.result != 'success' ||
          needs.strict-v3-frontend.result != 'success' ||
          needs.linux-v-master.result != 'success' ||
          needs.macos-abi-compile.result != 'success' ||
          needs.windows-abi-compile.result != 'success')
        run: exit 1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: required-checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: ${{ env.V_VERSION }}
          install-dependencies: false
      - name: Publish tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: v run tools/release_opencl.vsh release
      - name: Tag matching published module
        env:
          GH_TOKEN: ${{ secrets.OPENCL_PUBLISH_TOKEN }}
        run: v run tools/release_opencl.vsh tag-module
