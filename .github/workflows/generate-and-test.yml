name: Generate and test OpenCL bindings

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/OpenCL-Docs
          path: opencldocs
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/OpenCL-Headers
          path: openclheaders
      - uses: prantlf/setup-v-action@v4
      - name: Install OpenCL ICD development files
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev
      - name: Generate and check committed output
        run: |
          python3 src/main.py -registry opencldocs/xml/cl.xml opencl.v
          v fmt -w src/opencl.v
          v fmt -verify test/main.c.v
          git diff --exit-code -- src/opencl.v
      - name: Assemble module and run smoke test
        run: |
          install -d "$HOME/.vmodules/opencl"
          install -m 0644 src/opencl.v "$HOME/.vmodules/opencl/opencl.v"
          v -cc gcc run test
