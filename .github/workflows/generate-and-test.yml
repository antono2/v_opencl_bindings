name: Generate and test OpenCL bindings

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the required compiler and formatter so generated-source checks do not
  # change when a new V release artifact is published.
  V_VERSION: 0.5.2

jobs:
  generate-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: KhronosGroup/OpenCL-Docs
          ref: 5147e42c48fdab4ff61259162b9768d91842d53d
          path: opencldocs
      - uses: actions/checkout@v5
        with:
          repository: KhronosGroup/OpenCL-Headers
          ref: c4c8fd6f9556c92b212308880854e6294d61b314
          path: openclheaders
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Install OpenCL ICD development files and CPU implementation
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Generate bindings
        run: |
          test "$(git -C opencldocs rev-parse HEAD)" = "$(cat REGISTRY_COMMIT)"
          test "$(git -C openclheaders rev-parse HEAD)" = "$(cat HEADERS_COMMIT)"
          python3 test/test_generator.py
          python3 src/main.py -registry opencldocs/xml/cl.xml opencl.v
          v fmt -w src/opencl.v
          git diff --exit-code -- src/opencl.v
      - name: Assemble module and run smoke test
        run: |
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 src/opencl.v "$HOME/.vmodules/antono2/opencl/opencl.v"
          install -m 0644 src/convenience.v "$HOME/.vmodules/antono2/opencl/convenience.v"
          install -m 0644 src/ownership.v "$HOME/.vmodules/antono2/opencl/ownership.v"
          install -m 0644 src/program.v "$HOME/.vmodules/antono2/opencl/program.v"
          install -m 0644 src/event.v "$HOME/.vmodules/antono2/opencl/event.v"
          install -m 0644 src/capabilities.v "$HOME/.vmodules/antono2/opencl/capabilities.v"
          install -m 0644 src/external_interop.v "$HOME/.vmodules/antono2/opencl/external_interop.v"
          install -m 0644 v.mod "$HOME/.vmodules/antono2/opencl/v.mod"
          v -cc gcc run test
          v test test/convenience_test.v
          v test test/pointer_abi_test.v
          v -cc gcc run examples/vector_add
      - name: Install advanced-example dependencies
        run: |
          sudo apt-get install --yes libvulkan-dev libvulkan-volk-dev libglfw3-dev mesa-vulkan-drivers xauth xvfb
          v install antono2.vulkan
          v install antono2.glfw
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 src/opencl.v "$HOME/.vmodules/antono2/opencl/opencl.v"
          install -m 0644 src/convenience.v "$HOME/.vmodules/antono2/opencl/convenience.v"
          install -m 0644 src/ownership.v "$HOME/.vmodules/antono2/opencl/ownership.v"
          install -m 0644 src/program.v "$HOME/.vmodules/antono2/opencl/program.v"
          install -m 0644 src/event.v "$HOME/.vmodules/antono2/opencl/event.v"
          install -m 0644 src/capabilities.v "$HOME/.vmodules/antono2/opencl/capabilities.v"
          install -m 0644 src/external_interop.v "$HOME/.vmodules/antono2/opencl/external_interop.v"
          install -m 0644 v.mod VERSION LICENSE "$HOME/.vmodules/antono2/opencl/"
          install -d "$HOME/.vmodules/antono2/opencl/include/CL"
          install -m 0644 include/CL/opencl.h "$HOME/.vmodules/antono2/opencl/include/CL/opencl.h"
      - name: Build and test Vulkan particles example
        env:
          VULKAN_SDK: /usr
          GLFW_INCLUDE: /usr/include
          GLFW_LIB: /usr/lib/x86_64-linux-gnu
        run: |
          v -cc gcc -o /tmp/vulkan-particles examples/vulkan_particles
          PARTICLE_COUNT=1024 /tmp/vulkan-particles
          xvfb-run -a /tmp/vulkan-particles --staged --frames=8 --particles=1024
          v test examples/vulkan_particles/options_test.v
          v test examples/vulkan_particles/shader_test.v
          v test examples/vulkan_particles/interop_probe_test.v

  macos-abi-compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: KhronosGroup/OpenCL-Docs
          ref: 5147e42c48fdab4ff61259162b9768d91842d53d
          path: opencldocs
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Generate bindings
        run: |
          test "$(git -C opencldocs rev-parse HEAD)" = "$(cat REGISTRY_COMMIT)"
          python3 test/test_generator.py
          python3 src/main.py -registry opencldocs/xml/cl.xml opencl.v
          v fmt -w src/opencl.v
          git diff --exit-code -- src/opencl.v
      - name: Compile macOS ABI probe
        run: |
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 src/opencl.v "$HOME/.vmodules/antono2/opencl/opencl.v"
          install -m 0644 src/convenience.v "$HOME/.vmodules/antono2/opencl/convenience.v"
          install -m 0644 src/ownership.v "$HOME/.vmodules/antono2/opencl/ownership.v"
          install -m 0644 src/program.v "$HOME/.vmodules/antono2/opencl/program.v"
          install -m 0644 src/event.v "$HOME/.vmodules/antono2/opencl/event.v"
          install -m 0644 src/capabilities.v "$HOME/.vmodules/antono2/opencl/capabilities.v"
          install -m 0644 src/external_interop.v "$HOME/.vmodules/antono2/opencl/external_interop.v"
          install -m 0644 v.mod "$HOME/.vmodules/antono2/opencl/v.mod"
          install -d "$HOME/.vmodules/antono2/opencl/include/CL"
          install -m 0644 include/CL/opencl.h "$HOME/.vmodules/antono2/opencl/include/CL/opencl.h"
          v -cc clang -o /tmp/opencl-abi-probe abi/main.c.v

  linux-v-master:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: KhronosGroup/OpenCL-Docs
          ref: 5147e42c48fdab4ff61259162b9768d91842d53d
          path: opencldocs
      - uses: prantlf/setup-v-action@v4
        id: setup_v_master
        continue-on-error: true
        with:
          version: master
      - name: Install OpenCL runtime and headers
        if: steps.setup_v_master.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Generate and assemble module
        id: generate_v_master
        if: steps.setup_v_master.outcome == 'success'
        continue-on-error: true
        run: |
          test "$(git -C opencldocs rev-parse HEAD)" = "$(cat REGISTRY_COMMIT)"
          python3 test/test_generator.py
          python3 src/main.py -registry opencldocs/xml/cl.xml opencl.v
          v fmt -w src/opencl.v
          git diff --exit-code -- src/opencl.v
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 src/opencl.v src/convenience.v src/ownership.v src/program.v src/event.v src/capabilities.v src/external_interop.v v.mod "$HOME/.vmodules/antono2/opencl/"
      - name: Run correctness smoke tests on V master
        id: test_v_master
        if: steps.setup_v_master.outcome == 'success' && steps.generate_v_master.outcome == 'success'
        continue-on-error: true
        run: |
          v -cc gcc run test
          v test test/convenience_test.v
          v test test/pointer_abi_test.v
          v -cc gcc run examples/vector_add
      - name: Report V master compatibility warning
        if: always() && (steps.setup_v_master.outcome == 'failure' || steps.generate_v_master.outcome == 'failure' || steps.test_v_master.outcome == 'failure')
        run: echo "::warning::The live V master compatibility lane failed; stable V 0.5.2 remains authoritative."

  windows-abi-compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Install OpenCL SDK
        run: vcpkg install opencl:x64-windows
      - name: Assemble generated module and compile ABI probe
        shell: pwsh
        run: |
          $module = Join-Path $HOME '.vmodules/antono2/opencl'
          New-Item -ItemType Directory -Force $module | Out-Null
          Copy-Item src/opencl.v, src/convenience.v, src/ownership.v, src/program.v, src/event.v, src/capabilities.v, src/external_interop.v, v.mod -Destination $module
          $include = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/include'
          $lib = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/lib'
          v -cc msvc -cflags "/I$include" -ldflags "/LIBPATH:$lib" -o "$env:TEMP/opencl-abi-probe.exe" abi/main.c.v

  required-checks:
    name: required-checks
    if: always()
    needs: [generate-and-test, linux-v-master, macos-abi-compile, windows-abi-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported CI lane to pass
        env:
          GENERATE_RESULT: ${{ needs.generate-and-test.result }}
          V_MASTER_RESULT: ${{ needs.linux-v-master.result }}
          MACOS_RESULT: ${{ needs.macos-abi-compile.result }}
          WINDOWS_RESULT: ${{ needs.windows-abi-compile.result }}
        run: |
          for result in "$GENERATE_RESULT" "$V_MASTER_RESULT" "$MACOS_RESULT" "$WINDOWS_RESULT"; do
            test "$result" = success
          done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: required-checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release version
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "version: '$version'" v.mod
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "v_opencl_bindings $GITHUB_REF_NAME"
