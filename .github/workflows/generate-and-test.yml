name: Generate and test OpenCL bindings

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the required compiler and formatter so generated-source checks do not
  # change when a new V release artifact is published.
  V_VERSION: 0.5.2

jobs:
  generate-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KhronosGroup/OpenCL-Docs
          ref: 5147e42c48fdab4ff61259162b9768d91842d53d
          path: opencldocs
      - uses: actions/checkout@v7
        with:
          repository: KhronosGroup/OpenCL-Headers
          ref: c4c8fd6f9556c92b212308880854e6294d61b314
          path: openclheaders
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Install OpenCL ICD development files and CPU implementation
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Generate bindings
        run: |
          test "$(git -C opencldocs rev-parse HEAD)" = "$(cat REGISTRY_COMMIT)"
          test "$(git -C openclheaders rev-parse HEAD)" = "$(cat HEADERS_COMMIT)"
          python3 test/test_generator.py
          python3 test/test_sync_published_module.py
          python3 src/main.py -registry opencldocs/xml/cl.xml opencl.v
          v fmt -w src/opencl.v
          git diff --exit-code -- src/opencl.v
      - name: Assemble module and run smoke test
        run: |
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 src/opencl.v "$HOME/.vmodules/antono2/opencl/opencl.v"
          install -m 0644 src/convenience.v "$HOME/.vmodules/antono2/opencl/convenience.v"
          install -m 0644 src/ownership.v "$HOME/.vmodules/antono2/opencl/ownership.v"
          install -m 0644 src/program.v "$HOME/.vmodules/antono2/opencl/program.v"
          install -m 0644 src/event.v "$HOME/.vmodules/antono2/opencl/event.v"
          install -m 0644 src/capabilities.v "$HOME/.vmodules/antono2/opencl/capabilities.v"
          install -m 0644 src/external_interop.v "$HOME/.vmodules/antono2/opencl/external_interop.v"
          install -m 0644 src/image.v "$HOME/.vmodules/antono2/opencl/image.v"
          install -m 0644 src/svm.v "$HOME/.vmodules/antono2/opencl/svm.v"
          install -m 0644 v.mod "$HOME/.vmodules/antono2/opencl/v.mod"
          v -cc gcc run test
          v test test/convenience_test.v
          v test test/pointer_abi_test.v
          v -cc gcc run examples/vector_add
          v -cc gcc run examples/image_svm
      - name: Install advanced-example dependencies
        run: |
          sudo apt-get install --yes libvulkan-dev libvulkan-volk-dev libglfw3-dev mesa-vulkan-drivers vulkan-validationlayers xauth xvfb
          v install antono2.vulkan
          v install antono2.glfw
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 src/opencl.v "$HOME/.vmodules/antono2/opencl/opencl.v"
          install -m 0644 src/convenience.v "$HOME/.vmodules/antono2/opencl/convenience.v"
          install -m 0644 src/ownership.v "$HOME/.vmodules/antono2/opencl/ownership.v"
          install -m 0644 src/program.v "$HOME/.vmodules/antono2/opencl/program.v"
          install -m 0644 src/event.v "$HOME/.vmodules/antono2/opencl/event.v"
          install -m 0644 src/capabilities.v "$HOME/.vmodules/antono2/opencl/capabilities.v"
          install -m 0644 src/external_interop.v "$HOME/.vmodules/antono2/opencl/external_interop.v"
          install -m 0644 src/image.v "$HOME/.vmodules/antono2/opencl/image.v"
          install -m 0644 src/svm.v "$HOME/.vmodules/antono2/opencl/svm.v"
          install -m 0644 v.mod VERSION LICENSE "$HOME/.vmodules/antono2/opencl/"
          install -d "$HOME/.vmodules/antono2/opencl/include/CL"
          install -m 0644 include/CL/opencl.h "$HOME/.vmodules/antono2/opencl/include/CL/opencl.h"
      - name: Build and test Vulkan particles example
        env:
          VULKAN_SDK: /usr
          GLFW_INCLUDE: /usr/include
          GLFW_LIB: /usr/lib/x86_64-linux-gnu
        run: |
          v -cc gcc -o /tmp/vulkan-particles examples/vulkan_particles
          PARTICLE_COUNT=1024 /tmp/vulkan-particles
          v -cc tcc -o /tmp/vulkan-particles-tcc examples/vulkan_particles
          PARTICLE_COUNT=1024 /tmp/vulkan-particles-tcc
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            xvfb-run -a /tmp/vulkan-particles --staged --frames=16 --particles=1024 \
            2>&1 | tee /tmp/vulkan-particles-window.log
          if grep -E 'Validation (Error|Warning)' /tmp/vulkan-particles-window.log; then
            echo '::error::Vulkan validation reported a particle-renderer synchronization or API error'
            exit 1
          fi
          v test examples/vulkan_particles/options_test.v
          v test examples/vulkan_particles/shader_test.v
          v test examples/vulkan_particles/interop_probe_test.v

  macos-abi-compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KhronosGroup/OpenCL-Docs
          ref: 5147e42c48fdab4ff61259162b9768d91842d53d
          path: opencldocs
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Generate bindings
        run: |
          test "$(git -C opencldocs rev-parse HEAD)" = "$(cat REGISTRY_COMMIT)"
          python3 test/test_generator.py
          python3 src/main.py -registry opencldocs/xml/cl.xml opencl.v
          v fmt -w src/opencl.v
          git diff --exit-code -- src/opencl.v
      - name: Compile macOS ABI probe
        run: |
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 src/opencl.v "$HOME/.vmodules/antono2/opencl/opencl.v"
          install -m 0644 src/convenience.v "$HOME/.vmodules/antono2/opencl/convenience.v"
          install -m 0644 src/ownership.v "$HOME/.vmodules/antono2/opencl/ownership.v"
          install -m 0644 src/program.v "$HOME/.vmodules/antono2/opencl/program.v"
          install -m 0644 src/event.v "$HOME/.vmodules/antono2/opencl/event.v"
          install -m 0644 src/capabilities.v "$HOME/.vmodules/antono2/opencl/capabilities.v"
          install -m 0644 src/external_interop.v "$HOME/.vmodules/antono2/opencl/external_interop.v"
          install -m 0644 src/image.v "$HOME/.vmodules/antono2/opencl/image.v"
          install -m 0644 src/svm.v "$HOME/.vmodules/antono2/opencl/svm.v"
          install -m 0644 v.mod "$HOME/.vmodules/antono2/opencl/v.mod"
          install -d "$HOME/.vmodules/antono2/opencl/include/CL"
          install -m 0644 include/CL/opencl.h "$HOME/.vmodules/antono2/opencl/include/CL/opencl.h"
          v -cc clang -o /tmp/opencl-abi-probe abi/main.c.v

  linux-v-master:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KhronosGroup/OpenCL-Docs
          ref: 5147e42c48fdab4ff61259162b9768d91842d53d
          path: opencldocs
      # V master currently builds a separate v1_fallback executable for tool
      # commands such as `v test`. Keep the complete source build together;
      # setup-v-action@v4's reduced cache bundle omits that executable.
      - name: Check out V master
        uses: actions/checkout@v7
        id: checkout_v_master
        continue-on-error: true
        with:
          repository: vlang/v
          path: .ci-v-master
          fetch-depth: 1
      - name: Build V master
        id: setup_v_master
        if: steps.checkout_v_master.outcome == 'success'
        continue-on-error: true
        run: |
          make -C .ci-v-master
          echo "$GITHUB_WORKSPACE/.ci-v-master" >> "$GITHUB_PATH"
          .ci-v-master/v -V
      - name: Install OpenCL runtime and headers
        if: steps.setup_v_master.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Generate and assemble module
        id: generate_v_master
        if: steps.setup_v_master.outcome == 'success'
        continue-on-error: true
        run: |
          test "$(git -C opencldocs rev-parse HEAD)" = "$(cat REGISTRY_COMMIT)"
          python3 test/test_generator.py
          python3 src/main.py -registry opencldocs/xml/cl.xml opencl.v
          # Formatting determinism is enforced above with the pinned V release.
          # Here, compile the fresh generator output directly so V-master
          # formatter changes cannot masquerade as source incompatibilities.
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 src/opencl.v src/convenience.v src/ownership.v src/program.v src/event.v src/capabilities.v src/external_interop.v src/image.v src/svm.v v.mod "$HOME/.vmodules/antono2/opencl/"
      - name: Run correctness smoke tests on V master
        id: test_v_master
        if: steps.setup_v_master.outcome == 'success' && steps.generate_v_master.outcome == 'success'
        continue-on-error: true
        run: |
          v -cc gcc run test
          v test test/convenience_test.v
          v test test/pointer_abi_test.v
          v -cc gcc run examples/vector_add
          v -cc gcc run examples/image_svm
      - name: Report V master compatibility warning
        if: always() && (steps.checkout_v_master.outcome == 'failure' || steps.setup_v_master.outcome == 'failure' || steps.generate_v_master.outcome == 'failure' || steps.test_v_master.outcome == 'failure')
        run: echo "::warning::The live V master compatibility lane failed; stable V 0.5.2 remains authoritative."

  windows-abi-compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Install OpenCL SDK
        run: vcpkg install opencl:x64-windows
      - name: Assemble generated module and compile ABI probe
        shell: pwsh
        run: |
          $module = Join-Path $HOME '.vmodules/antono2/opencl'
          New-Item -ItemType Directory -Force $module | Out-Null
          Copy-Item src/opencl.v, src/convenience.v, src/ownership.v, src/program.v, src/event.v, src/capabilities.v, src/external_interop.v, src/image.v, src/svm.v, v.mod -Destination $module
          $include = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/include'
          $lib = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/lib'
          v -cc msvc -cflags "/I$include" -ldflags "/LIBPATH:$lib" -o "$env:TEMP/opencl-abi-probe.exe" abi/main.c.v

  required-checks:
    name: required-checks
    if: always()
    needs: [generate-and-test, linux-v-master, macos-abi-compile, windows-abi-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported CI lane to pass
        env:
          GENERATE_RESULT: ${{ needs.generate-and-test.result }}
          V_MASTER_RESULT: ${{ needs.linux-v-master.result }}
          MACOS_RESULT: ${{ needs.macos-abi-compile.result }}
          WINDOWS_RESULT: ${{ needs.windows-abi-compile.result }}
        run: |
          for result in "$GENERATE_RESULT" "$V_MASTER_RESULT" "$MACOS_RESULT" "$WINDOWS_RESULT"; do
            test "$result" = success
          done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: required-checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release version
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "version: '$version'" v.mod
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "v_opencl_bindings $GITHUB_REF_NAME"
      - name: Tag matching published module
        env:
          GH_TOKEN: ${{ secrets.OPENCL_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          generator_commit=$(git rev-parse "$GITHUB_REF_NAME^{}")
          version=$(cat VERSION)
          opencl_commit=$(gh api repos/antono2/opencl/git/ref/heads/master --jq '.object.sha')
          read_opencl_file() {
            gh api "repos/antono2/opencl/contents/$1?ref=$opencl_commit" --jq '.content' | base64 --decode
          }
          test "$(read_opencl_file VERSION)" = "$version"
          test "$(read_opencl_file GENERATOR_COMMIT)" = "$generator_commit"
          grep -F "version: '$version'" < <(read_opencl_file v.mod)

          if existing_refs=$(git ls-remote --exit-code \
            https://github.com/antono2/opencl.git \
            "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}" 2>/dev/null); then
            existing_commit=$(printf '%s\n' "$existing_refs" | awk '
              /\^\{\}$/ { peeled = $1 }
              !/\^\{\}$/ { direct = $1 }
              END { print peeled != "" ? peeled : direct }
            ')
            if test "$existing_commit" != "$opencl_commit"; then
              echo "::error::opencl $GITHUB_REF_NAME already resolves to $existing_commit, expected $opencl_commit"
              exit 1
            fi
            echo "opencl $GITHUB_REF_NAME already points to $opencl_commit"
            exit 0
          fi

          tag_object=$(gh api --method POST repos/antono2/opencl/git/tags \
            -f tag="$GITHUB_REF_NAME" \
            -f message="Release $GITHUB_REF_NAME synchronized from v_opencl_bindings" \
            -f object="$opencl_commit" \
            -f type=commit \
            --jq '.sha')
          gh api --method POST repos/antono2/opencl/git/refs \
            -f ref="refs/tags/$GITHUB_REF_NAME" \
            -f sha="$tag_object" >/dev/null
