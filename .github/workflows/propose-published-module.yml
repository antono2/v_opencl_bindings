name: Propose published OpenCL module update

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'test/convenience_test.v'
      - 'test/helpers_test.v'
      - 'test/test_dynamic_runtime.vsh'
      - 'tools/check_docs.vsh'
      - 'algorithms/**'
      - 'docs/**'
      - 'test/pointer_abi_*'
      - 'abi/**'
      - 'examples/**'
      - 'include/**'
      - 'packaging/published_setup.vsh'
      - 'packaging/published_README.md'
      - 'API_DESIGN.md'
      - 'OWNERSHIP.md'
      - 'REGISTRY_COMMIT'
      - 'HEADERS_COMMIT'
      - 'LICENSE'
      - 'VERSION'
      - 'v.mod'
      - 'tools/sync_published_module.vsh'
      - 'tools/propose_published_module.vsh'
      - '.github/workflows/propose-published-module.yml'
  workflow_dispatch:
    inputs:
      refresh_provenance:
        description: Record the exact generator commit for release preparation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-opencl-module
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Queued automatic runs publish the latest reviewed source, avoiding
          # proposals that rewind content after a newer commit has landed.
          ref: ${{ github.event_name == 'push' && 'master' || github.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/opencl
          path: published
          token: ${{ secrets.OPENCL_PUBLISH_TOKEN }}
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
          install-dependencies: false
      - name: Verify quiet proposal publishing
        run: v run tools/publish_generated_branch.vsh --self-test
      - name: Synchronize the distribution and update the publication pull request
        env:
          REFRESH_PROVENANCE: ${{ inputs.refresh_provenance || false }}
          GH_TOKEN: ${{ secrets.OPENCL_PUBLISH_TOKEN }}
        run: v run tools/propose_published_module.vsh
