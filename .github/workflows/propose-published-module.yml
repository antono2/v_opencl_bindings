name: Propose published OpenCL module update

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'test/convenience_test.v'
      - 'test/pointer_abi_*'
      - 'abi/**'
      - 'examples/**'
      - 'include/**'
      - 'packaging/published_setup.vsh'
      - 'packaging/published_README.md'
      - 'API_DESIGN.md'
      - 'OWNERSHIP.md'
      - 'REGISTRY_COMMIT'
      - 'HEADERS_COMMIT'
      - 'LICENSE'
      - 'VERSION'
      - 'v.mod'
      - 'tools/sync_published_module.py'
      - '.github/workflows/propose-published-module.yml'
  workflow_dispatch:
    inputs:
      refresh_provenance:
        description: Record the exact generator commit for release preparation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-opencl-module
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/opencl
          path: published
          token: ${{ secrets.OPENCL_PUBLISH_TOKEN }}
      - name: Synchronize canonical distribution files
        env:
          GENERATOR_COMMIT: ${{ github.sha }}
          REFRESH_PROVENANCE: ${{ inputs.refresh_provenance || false }}
        run: |
          args=()
          if [[ "$REFRESH_PROVENANCE" == true ]]; then
            args+=(--refresh-provenance)
          fi
          python3 tools/sync_published_module.py published --generator-commit "$GENERATOR_COMMIT" "${args[@]}"
      - name: Create or update the publication pull request
        env:
          GH_TOKEN: ${{ secrets.OPENCL_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          branch=automation/v-opencl-bindings
          git -C published checkout -B "$branch"
          git -C published add --all
          if git -C published diff --cached --quiet; then
            echo "The published module is already synchronized"
            pr_number=$(gh pr list --repo antono2/opencl --state open --head "$branch" \
              --json number --jq '.[0].number // empty')
            if test -n "$pr_number"; then
              files=$(gh pr view "$pr_number" --repo antono2/opencl \
                --json files --jq '.files[].path')
              if [[ "$files" == GENERATOR_COMMIT ]]; then
                gh pr close "$pr_number" --repo antono2/opencl --delete-branch
              fi
            fi
            exit 0
          fi
          git -C published config user.name github-actions[bot]
          git -C published config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C published commit -m "Update generated OpenCL bindings"
          remote_ref="refs/heads/$branch"
          remote_sha=$(git -C published ls-remote origin "$remote_ref" | awk '{print $1}')
          git -C published push --force-with-lease="$remote_ref:$remote_sha" origin "HEAD:$remote_ref"
          cd published
          body="Automated synchronization from antono2/v_opencl_bindings at $GITHUB_SHA. Version metadata is synchronized automatically. Merge this PR before tagging the synchronized generator commit for release."
          pr_number=$(gh pr list --repo antono2/opencl --state open --head "$branch" \
            --json number --jq '.[0].number // empty')
          if test -n "$pr_number"; then
            gh pr edit "$pr_number" --repo antono2/opencl \
              --body "$body"
          else
            gh pr create --repo antono2/opencl --base master --head "$branch" \
              --title "Update generated OpenCL bindings" \
              --body "$body"
          fi
